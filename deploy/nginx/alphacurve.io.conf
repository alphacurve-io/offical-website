
server {

        root /var/www/alphacurve.io/html;
        index index.html index.htm index.php index.nginx-debian.html;
        #server_name alphacurve.io www.alphacurve.io;
        server_name alphacurve.io;

	access_log /var/log/nginx/alphacurve_access.log;
	error_log /var/log/nginx/alphacurve_error.log warn;

	location /junelai/auditing {
		proxy_pass http://35.221.181.4;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		
		# 確保支援 WebSocket 與長連線（如有需要）
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}


        location /website/api/submit {
		proxy_pass http://backend_alphacurve_api;
	}
	location /api/chat {
		proxy_pass http://backend_alphacurve_api;
	}
	location /api/emotion {
		proxy_pass http://backend_alphacurve_api;
	}
	location /api/emotion_reply {
		proxy_pass http://backend_alphacurve_api;
	}
	location /health {
		proxy_pass http://backend_alphacurve_api;
	}
	location / {
                try_files $uri $uri/ /index.html;
		gzip_static on;
    		# 靜態資源快取設定
    		location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm|webp)$ {
			expires 1y;
			add_header Cache-Control "public, immutable, max-age=31536000";
			access_log off;  # reduce i/o
			# enable compression
			gzip_static on;
			
		}
		# HTML 檔案較短的快取時間
		location ~* \.(html)$ {
			expires 1h;
			add_header Cache-Control "public, max-age=3600";
		}
		# JSON 和 manifest 檔案
		location ~* \.(json|webmanifest)$ {
			expires 1d;
			add_header Cache-Control "public, max-age=86400";
		}
        }
	location ~* /static/js/main-.*\.js$ {
		expires 1y;
		add_header Cache-Control "public, immutable, max-age=31536000";
		gzip_static on;
	}
	location /callback {
		proxy_pass http://backend_dassy;
	}
	location /james_ai_assistant_callback {
		proxy_pass http://james_ai_assistant_callback;
	}
	location /api/v1/line/webhook {
		proxy_pass http://backend_mina;
	}

	location /callback_mworoi {
		proxy_pass http://backend_tim;
	}	
	location /demo-island/ {
		proxy_pass http://backend_demo_island;
		add_header 'Access-Control-Allow-Origin' '*'; #'https://diamondisland-main.vercel.app, http://localhost:3000';
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, PUT';



		add_header 'Access-Control-Allow-Headers' 'Referer, User-Agent, Content-Type, Authorization, Accept, Accept-Encoding, Accept-Language, Connection, Content-Length, Dnt, Host, Origin, Sec-Ch-Ua, Sec-Ch-Ua-Mobile, Sec-Fetch-Dest, Sec-Fetch-Mode, Sec-Fetch-Site, Sec-Ch-Ua-Platform, Pragma, Cache-Control, access-control-request-headers, access-control-request-headers';

		proxy_redirect off; #default;
		if ($request_method = 'OPTIONS') {
            		add_header 'Access-Control-Allow-Origin' '*';
            		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
			#add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
            		
			add_header 'Access-Control-Allow-Headers' 'Referer, User-Agent, Content-Type, Authorization, Accept, Accept-Encoding, Accept-Language, Connection, Content-Length, Dnt, Host, Origin, Sec-Ch-Ua, Sec-Ch-Ua-Mobile, Sec-Fetch-Dest, Sec-Fetch-Mode, Sec-Fetch-Site, Sec-Ch-Ua-Platform, Pragma, Cache-Control, access-control-request-headers, access-control-request-headers';
			add_header 'Access-Control-Max-Age' 3600;
            		return 204;
        	}
	}
	location /diamond-island/ {
		proxy_pass http://backend_diamond_island;
		#add_header 'Access-Control-Allow-Origin' '*';
		#add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, PUT, PATCH';
		#add_header 'Access-Control-Allow-Headers' 'Referer, User-Agent, Accept, Origin, Authorization, Accept, Content-Type';
		#proxy_redirect off;
		add_header 'Access-Control-Allow-Origin' '*'; #'https://diamondisland-main.vercel.app, http://localhost:3000';
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, PUT, PATCH';
		#add_header 'Access-Control-Allow-Headers' 'Origin, Authorization, Accept, Content-Type';
		add_header 'Access-Control-Allow-Headers' 'Referer, User-Agent, Content-Type, Authorization, Accept, Accept-Encoding, Accept-Language, Connection, Content-Length, Dnt, Host, Origin, Sec-Ch-Ua, Sec-Ch-Ua-Mobile, Sec-Fetch-Dest, Sec-Fetch-Mode, Sec-Fetch-Site, Sec-Ch-Ua-Platform, Pragma, Cache-Control, access-control-request-headers, access-control-request-headers';
		proxy_redirect off; #default;
		if ($request_method = 'OPTIONS') {
            		add_header 'Access-Control-Allow-Origin' '*';
            		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
        	    	
			add_header 'Access-Control-Allow-Headers' 'Referer, User-Agent, Content-Type, Authorization, Accept, Accept-Encoding, Accept-Language, Connection, Content-Length, Dnt, Host, Origin, Sec-Ch-Ua, Sec-Ch-Ua-Mobile, Sec-Fetch-Dest, Sec-Fetch-Mode, Sec-Fetch-Site, Sec-Ch-Ua-Platform, Pragma, Cache-Control, access-control-request-headers, access-control-request-headers';
            		add_header 'Access-Control-Max-Age' 3600;
            		return 204;
        	}	
	}
	location /srt_files {
		proxy_pass http://backend_file_server;
	}
	location /artfloor {

		proxy_pass http://backend_artfloor;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# 添加 CORS 標頭
    		add_header Access-Control-Allow-Origin *;
    		add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
    		add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
    		add_header Access-Control-Allow-Credentials true;

  	 	# 處理 OPTIONS 預檢請求
    		if ($request_method = OPTIONS) {
        		add_header Access-Control-Allow-Origin *;
        		add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
        		add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
        		add_header Access-Control-Allow-Credentials true;
        		return 204;
    		}
	}

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alphacurve.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alphacurve.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = alphacurve.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


        listen 80;
        listen [::]:80;
        server_name alphacurve.io;
    return 404; # managed by Certbot


}
